<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gift Message Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,.10);--glass2:rgba(255,255,255,.16);--edge:rgba(255,255,255,.38);--txt:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Roboto,system-ui,sans-serif;color:var(--txt);background:#0a1020}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;
 background:radial-gradient(40% 35% at 20% 15%,#3b82f6 0,transparent 60%),
 radial-gradient(40% 35% at 85% 25%,#a855f7 0,transparent 60%),
 radial-gradient(45% 40% at 70% 90%,#06b6d4 0,transparent 60%),
 radial-gradient(35% 35% at 10% 85%,#ec4899 0,transparent 60%),#0a1020;
 filter:blur(30px) saturate(130%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.08)}}
.wrap{padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
 backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
 border:1px solid var(--edge);border-radius:22px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.10),0 12px 40px rgba(0,0,0,.35)}
h1{font-size:20px;margin:6px 4px 12px;font-weight:700;letter-spacing:.2px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.panel{padding:14px;margin-top:12px}
.tabs{display:flex;gap:6px;padding:5px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:16px;background:transparent;color:#fff;font:500 14px Roboto;transition:.25s}
.tabs button.on{background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 14px rgba(0,0,0,.25)}
label{display:block;font-size:12px;opacity:.8;margin:12px 2px 5px}
input,select{width:100%;padding:12px 13px;border-radius:14px;border:1px solid rgba(255,255,255,.28);
 background:rgba(255,255,255,.10);color:#fff;font:400 15px Roboto;outline:none;
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
input::placeholder{color:rgba(255,255,255,.5)}
input:focus,select:focus{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.16)}
select option{color:#000}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.sw{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.sw input{width:auto}
.btn{width:100%;margin-top:14px;padding:14px;border:1px solid rgba(255,255,255,.5);border-radius:18px;color:#fff;font:700 15px Roboto;
 background:linear-gradient(135deg,rgba(80,160,255,.75),rgba(150,90,255,.65));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 26px rgba(80,120,255,.45);transition:.2s}
.btn:active{transform:scale(.98)}
.btn.alt{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
#msg{font-size:13px;margin-top:10px;min-height:18px;opacity:.9;text-align:center}

/* ---- сцена: карточка строго по центру ---- */
.stage{position:relative;margin:6px 0;border-radius:26px;overflow:hidden;aspect-ratio:9/16;
 background:linear-gradient(160deg,#16222f,#0f1822);border:1px solid var(--edge);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 18px 50px rgba(0,0,0,.45)}
.stage.light{background:linear-gradient(160deg,#e4eedc,#cfe0c6)}
.stage .pat{position:absolute;inset:0;opacity:.08;background-image:
 radial-gradient(circle at 20% 20%,transparent 8px,#fff 9px,#fff 10px,transparent 11px),
 radial-gradient(circle at 70% 60%,transparent 6px,#fff 7px,#fff 8px,transparent 9px);
 background-size:60px 60px,80px 80px}
.stage.light .pat{filter:invert(1)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 5%}
.pill{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.07));backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);
 border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 20px rgba(0,0,0,.25);
 color:#fff;border-radius:22px;padding:8px 17px;text-align:center;font-size:clamp(11px,3.4vw,16px);max-width:92%;line-height:1.3;animation:fade .6s both}
.stage.light .pill{color:#1d2b1d;border-color:rgba(0,0,0,.15);background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35))}
.card{width:66%;border-radius:26px;position:relative;overflow:hidden;color:#fff;text-align:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;
 border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -20px 40px rgba(255,255,255,.04),0 18px 44px rgba(0,0,0,.45)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12) 100%)}
.card.stars{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04)),rgba(10,20,30,.55);
 backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);padding:6% 6% 8%}
.card.nft{padding:0 0 7%}
.gift-img{display:block;margin:0 auto;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.t1{font-weight:700;font-size:clamp(14px,4.6vw,24px);margin-top:3%;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.t2{font-size:clamp(11px,3.3vw,16px);opacity:.8;margin-top:2%}
.desc{font-size:clamp(11px,3.3vw,16px);opacity:.92;margin:3% 4% 6%}
.vbtn{display:inline-block;position:relative;padding:2.6% 9%;border-radius:30px;font-weight:700;font-size:clamp(12px,3.8vw,18px);
 border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.25);
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.stars .vbtn{background:linear-gradient(135deg,rgba(110,150,220,.75),rgba(70,100,170,.65))}
.spark{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 1.4s infinite}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin:4% 8% 5%;font-size:clamp(11px,3.4vw,16px);text-align:left}
.fields span{opacity:.75;text-align:right}.fields b{font-weight:700}
.ribbon{position:absolute;top:14px;right:-34px;transform:rotate(45deg);width:120px;text-align:center;font-size:11px;font-weight:700;padding:2px 0;background:rgba(0,0,0,.35);z-index:2}
.mock{position:absolute;right:12px;bottom:10px;font-size:11px;font-weight:700;opacity:.55;color:#fff}
canvas#conf{position:absolute;inset:0;pointer-events:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
/* режим записи: на весь экран, карточка по центру */
body.rec::before{display:none}
body.rec{background:#16222f}
body.rec .wrap>*:not(.stage){display:none}
body.rec .wrap{padding:0;max-width:none}
body.rec .stage{margin:0;border-radius:0;border:0;width:100vw;height:100vh;aspect-ratio:auto;box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gift Message Studio</h1>
  <div class="tabs glass">
    <button id="tab-stars" class="on">⭐ Звёзды</button>
    <button id="tab-nft">🖼 NFT</button>
    <button id="tab-custom">✨ Свой</button>
  </div>

  <div class="stage" id="stage">
    <div class="pat"></div>
    <div class="center" id="center"></div>
    <canvas id="conf"></canvas>
  </div>
  <div class="row">
    <button class="btn alt" id="replay">↻ Повторить</button>
    <button class="btn alt" id="recmode">🎬 Для записи</button>
  </div>

  <div id="nftbox" class="panel glass" style="display:none">
    <label>Ссылка на NFT-подарок (t.me/nft/Название-123)</label>
    <input id="link" placeholder="t.me/nft/LoveCandle-123" inputmode="url">
    <div class="row">
      <div><label>Модель</label><input id="model"></div>
      <div><label>Номер</label><input id="num" inputmode="numeric"></div>
    </div>
    <div class="row">
      <div><label>Фон</label><input id="backdrop"></div>
      <div><label>Узор</label><input id="symbol"></div>
    </div>
    <label>Цвет фона карточки</label>
    <input id="color" type="color" value="#c2593a" style="height:44px;padding:4px">
  </div>

  <div id="custombox" class="panel glass" style="display:none">
    <label style="margin-top:0">Картинка подарка (PNG с прозрачным фоном лучше всего)</label>
    <input id="cfile" type="file" accept="image/*">
    <label>Название подарка</label>
    <input id="ctitle" placeholder="Например: Золотая корона">
    <div class="row">
      <div><label>Номер (необязательно)</label><input id="cnum" inputmode="numeric" placeholder="10783"></div>
      <div><label>Узор (символ)</label><input id="cpat" maxlength="2" placeholder="🔧"></div>
    </div>
    <div class="row">
      <div><label>Модель</label><input id="cmodel" placeholder="Legacy"></div>
      <div><label>Фон</label><input id="cback" placeholder="Burnt Sienna"></div>
    </div>
    <label>Название узора</label>
    <input id="csym" placeholder="Spanner">
    <div class="row">
      <div><label>Цвет в центре</label><input id="ccol1" type="color" value="#d66f3c" style="height:44px;padding:4px"></div>
      <div><label>Цвет по краям</label><input id="ccol2" type="color" value="#b54b2d" style="height:44px;padding:4px"></div>
    </div>
  </div>

  <div id="starsbox" class="panel glass">
    <div class="row">
      <div><label>Звёзды</label><input id="stars" value="75" inputmode="numeric"></div>
      <div><label>TON</label><input id="ton" value="0,83"></div>
      <div><label>$</label><input id="usd" value="1,12"></div>
    </div>
  </div>

  <div class="panel glass">
  <label style="margin-top:0">Имя отправителя</label>
  <input id="sender" placeholder="Неизвестный пользователь">
  <div class="sw"><input type="checkbox" id="unknown" checked><label style="margin:0;opacity:1">«Неизвестный пользователь»</label></div>
  <label>Текст плашки (пусто = по умолчанию)</label>
  <input id="banner">
  <div class="row">
    <div><label>Дата над плашкой (NFT)</label><input id="date" placeholder="3 июля"></div>
    <div><label>Текст кнопки</label><input id="button" value="Посмотреть"></div>
  </div>
  <div class="row">
    <div><label>Фон чата</label>
      <select id="bg"><option value="dark">Тёмный</option><option value="light">Светлый</option></select></div>
    <div class="sw" style="align-items:flex-end"><input type="checkbox" id="mock" checked><label style="margin:0;opacity:1">Метка МАКЕТ</label></div>
  </div>

  </div>
  <button class="btn" id="send">Показать в чате</button>
  <div id="msg"></div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
let kind = 'stars', nft = null, customImg = '';

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`}
function name(){return $('unknown').checked ? 'Неизвестный пользователь' : ($('sender').value||'Неизвестный пользователь')}

function starBoxSVG(){return `<svg class="gift-img" width="62%" viewBox="0 0 200 200"><polygon points="30,80 170,80 155,175 45,175" fill="#46a03c"/><polygon points="30,80 55,55 145,55 170,80" fill="#64be50"/><rect x="88" y="55" width="24" height="120" fill="#ffbe28"/><rect x="30" y="105" width="140" height="18" fill="#ffbe28"/><polygon points="100,2 113,32 146,34 120,54 129,86 100,68 71,86 80,54 54,34 87,32" fill="#ffcd28" stroke="#ffe678"/></svg>`}

function draw(){
  const c = $('center'); $('stage').className = 'stage' + ($('bg').value==='light'?' light':'');
  const mock = $('mock').checked ? '<div class="mock">МАКЕТ</div>' : '';
  const btn = esc($('button').value||'Посмотреть');
  if (kind==='stars'){
    const t = $('banner').value || `${name()} отправил(а) Вам подарок стоимостью ${$('ton').value} TON (~ ${$('usd').value} $)`;
    c.innerHTML = `<div class="pill">${esc(t)}</div>
      <div class="card stars">${starBoxSVG()}
        <div class="t1">${esc($('stars').value)} звёзд</div>
        <div class="desc">Используйте звёзды, чтобы открывать контент и получать услуги в Telegram.</div>
        <div class="vbtn">${btn}<i class="spark" style="left:8%;top:12%"></i><i class="spark" style="right:6%;bottom:14%;animation-delay:.5s"></i></div>
      </div>${mock}`;
  } else {
    const isC = kind==='custom';
    const col = isC ? $('ccol1').value : $('color').value;
    const col2 = isC ? $('ccol2').value : shade(col,.8);
    const t = $('banner').value || `${name()} передал(а) Вам подарок!`;
    const d = $('date').value ? `<div class="pill">${esc($('date').value)}</div>` : '';
    const title = isC ? ($('ctitle').value||'Название') : (nft ? nft.title : 'Название');
    const nraw = isC ? $('cnum').value : $('num').value;
    const num = Number(nraw||0).toLocaleString('en-US');
    const subt = (nraw && Number(nraw)>0) ? `${esc(title)} #${num}` : esc(title);
    const model = isC ? ($('cmodel').value||'—') : ($('model').value||'—');
    const back = isC ? ($('cback').value||'—') : ($('backdrop').value||'—');
    const sym = isC ? ($('csym').value||'—') : ($('symbol').value||'—');
    const img = isC ? (customImg ? `<img class="gift-img" width="60%" src="${customImg}">` : '<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:54px;opacity:.5">🎁</div>')
      : (nft ? `<img class="gift-img" width="60%" src="${esc(nft.image)}" onerror="this.style.display='none'">` : '<div style="height:120px"></div>');
    const pat = (isC && $('cpat').value) ? `<div style="position:absolute;inset:0;opacity:.2;font-size:34px;line-height:64px;letter-spacing:34px;overflow:hidden;color:#000;word-break:break-all;pointer-events:none">${esc($('cpat').value).repeat(120)}</div>` : '';
    c.innerHTML = `${d}<div class="pill">${esc(t)}</div>
      <div class="card nft" style="background:radial-gradient(circle at 50% 30%,${col},${col2})">
        ${pat}<div class="ribbon">подарок</div>
        <div style="padding-top:8%">${img}</div>
        <div class="t1">Подарок от ${esc(name())}</div>
        <div class="t2">${subt}</div>
        <div class="fields"><span>Модель</span><b>${esc(model)}</b><span>Фон</span><b>${esc(back)}</b><span>Узор</span><b>${esc(sym)}</b></div>
        <div class="vbtn" style="background:${shade(col2,.75)}">${btn}</div>
      </div>${mock}`;
  }
  confetti();
}

/* конфетти */
function confetti(){
  const cv=$('conf'), st=$('stage'); cv.width=st.clientWidth; cv.height=st.clientHeight;
  const x=cv.getContext('2d'), P=[], cols=['#ffd23f','#ee4266','#3bceac','#0ead69','#5aa9ff','#fff'];
  for(let i=0;i<170;i++){const a=Math.random()*Math.PI*2, s=4+Math.random()*9;
    P.push({x:cv.width/2,y:cv.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:1})}
  const t0=performance.now();
  (function f(t){const el=(t-t0)/3000; x.clearRect(0,0,cv.width,cv.height); if(el>=1)return;
    P.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=1-el;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    requestAnimationFrame(f)})(t0);
}

function setKind(k){kind=k;['stars','nft','custom'].forEach(x=>{$('tab-'+x).className=k===x?'on':'';});
  $('starsbox').style.display=k==='stars'?'':'none';$('nftbox').style.display=k==='nft'?'':'none';$('custombox').style.display=k==='custom'?'':'none';draw()}
$('tab-stars').onclick=()=>setKind('stars'); $('tab-nft').onclick=()=>setKind('nft'); $('tab-custom').onclick=()=>setKind('custom');
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{
  if(e.type==='file')return;
  if(e.id==='stars'){const s=+e.value||0;$('ton').value=(s*0.0111).toFixed(2).replace('.',',');$('usd').value=(s*0.015).toFixed(2).replace('.',',')}
  if(e.id!=='link')draw()}));
$('replay').onclick=draw;
$('recmode').onclick=()=>{document.body.classList.add('rec');draw();let last=0;
  document.body.onclick=()=>{const n=Date.now();if(n-last<350){document.body.classList.remove('rec');document.body.onclick=null}else draw();last=n}};

$('link').addEventListener('change',()=>{
  const m=($('link').value||'').match(/t\.me\/nft\/([A-Za-z0-9_]+)-(\d+)/i);
  if(!m){$('msg').textContent='Ссылка вида t.me/nft/Название-123';return}
  nft={slug:m[1],number:+m[2],title:m[1].replace(/([a-z])([A-Z])/g,'$1 $2'),image:`https://nft.fragment.com/gift/${m[1].toLowerCase()}-${m[2]}.large.jpg`};
  $('num').value=m[2];$('msg').textContent='Ссылка принята. Модель, фон и узор бот подтянет сам ✓';draw()});

$('send').onclick=()=>{
  const params={kind,sender:name(),stars:$('stars').value,ton:$('ton').value,usd:$('usd').value,
    banner:$('banner').value,date:$('date').value,button:$('button').value,bg:$('bg').value,mock:$('mock').checked};
  if(kind==='nft'){
    if(!nft){$('msg').textContent='Сначала вставь ссылку на NFT-подарок';return}
    params.link=$('link').value;params.number=+$('num').value||nft.number;
  }
  if(kind==='custom'){
    if(!customImg){$('msg').textContent='Сначала загрузи картинку подарка';return}
    params.custom={title:$('ctitle').value,number:$('cnum').value,model:$('cmodel').value,backdrop:$('cback').value,
      symbol:$('csym').value,color:$('ccol1').value,colorEdge:$('ccol2').value,patternText:$('cpat').value};
    params.hasImage=true;
    // картинка не помещается в sendData (лимит 4096 байт): отправляем её отдельно через бота
    $('msg').textContent='Для своей картинки: пришли её боту с подписью, как в /help (лимит Telegram на данные Mini App).';
    return;
  }
  const data=JSON.stringify(params);
  if(data.length>3800){$('msg').textContent='Слишком длинные тексты';return}
  if(tg&&tg.sendData){$('msg').textContent='Отправляю…';tg.sendData(data)}
  else $('msg').textContent='Открой Mini App из бота (кнопка внизу), там отправка работает'};

$('cfile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader(); rd.onload=()=>{const im=new Image(); im.onload=()=>{
    const k=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    customImg=c.toDataURL('image/png'); $('msg').textContent='Картинка загружена ✓'; draw()}; im.src=rd.result}; rd.readAsDataURL(f)});

draw();
</script>
</body>
</html>
