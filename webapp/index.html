<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gift Message Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:Roboto,system-ui,sans-serif;background:var(--tg-theme-bg-color,#17212b);color:var(--tg-theme-text-color,#fff)}
.wrap{padding:12px 14px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:18px;margin:6px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 4px;border:0;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#232e3c);color:inherit;font:500 13px Roboto}
.tabs button.on{background:var(--tg-theme-button-color,#2ea6ff);color:var(--tg-theme-button-text-color,#fff)}
label{display:block;font-size:12px;opacity:.7;margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff22;background:var(--tg-theme-secondary-bg-color,#232e3c);color:inherit;font:400 15px Roboto}
.row{display:flex;gap:8px}.row>*{flex:1}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.sw input{width:auto}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--tg-theme-button-color,#2ea6ff);color:var(--tg-theme-button-text-color,#fff);font:700 15px Roboto}
.btn.alt{background:var(--tg-theme-secondary-bg-color,#232e3c);color:inherit}
#msg{font-size:13px;margin-top:8px;min-height:18px;opacity:.85}
/* ---- сцена (макет чата Telegram) ---- */
.stage{position:relative;margin:10px 0;border-radius:16px;overflow:hidden;aspect-ratio:9/16;background:#141e28}
.stage.light{background:#dee8d6}
.stage .pat{position:absolute;inset:0;opacity:.07;background-image:
 radial-gradient(circle at 20% 20%,transparent 8px,#fff 9px,#fff 10px,transparent 11px),
 radial-gradient(circle at 70% 60%,transparent 6px,#fff 7px,#fff 8px,transparent 9px);
 background-size:60px 60px,80px 80px}
.stage.light .pat{filter:invert(1)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 5%}
.pill{background:rgba(0,0,0,.45);color:#fff;border-radius:22px;padding:7px 16px;text-align:center;font-size:clamp(11px,3.4vw,16px);max-width:92%;line-height:1.3;animation:fade .6s both}
.stage.light .pill{background:rgba(60,80,60,.55)}
.card{width:66%;border-radius:22px;position:relative;overflow:hidden;color:#fff;text-align:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.card.stars{background:rgba(8,16,24,.6);padding:6% 6% 8%}
.card.nft{padding:0 0 7%}
.gift-img{display:block;margin:0 auto;animation:float 3s ease-in-out infinite}
.t1{font-weight:700;font-size:clamp(14px,4.6vw,24px);margin-top:3%}
.t2{font-size:clamp(11px,3.3vw,16px);opacity:.78;margin-top:2%}
.desc{font-size:clamp(11px,3.3vw,16px);opacity:.9;margin:3% 4% 6%}
.vbtn{display:inline-block;position:relative;padding:2.6% 9%;border-radius:30px;font-weight:700;font-size:clamp(12px,3.8vw,18px)}
.card.stars .vbtn{background:rgba(70,100,150,.8)}
.spark{position:absolute;width:10px;height:10px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 1.4s infinite}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin:4% 8% 5%;font-size:clamp(11px,3.4vw,16px);text-align:left}
.fields span{opacity:.7;text-align:right}.fields b{font-weight:700}
.ribbon{position:absolute;top:14px;right:-34px;transform:rotate(45deg);width:120px;text-align:center;font-size:11px;font-weight:700;padding:2px 0;background:rgba(0,0,0,.35)}
.mock{position:absolute;right:10px;bottom:8px;font-size:11px;font-weight:700;opacity:.5;color:#fff}
canvas#conf{position:absolute;inset:0;pointer-events:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
/* режим записи */
body.rec .wrap>*:not(.stage){display:none}
body.rec .wrap{padding:0;max-width:none}
body.rec .stage{margin:0;border-radius:0;width:100vw;height:100vh;aspect-ratio:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎁 Gift Message Studio</h1>
  <div class="tabs">
    <button id="tab-stars" class="on">⭐ Звёзды</button>
    <button id="tab-nft">🖼 NFT-подарок</button>
  </div>

  <div class="stage" id="stage">
    <div class="pat"></div>
    <div class="center" id="center"></div>
    <canvas id="conf"></canvas>
  </div>
  <div class="row">
    <button class="btn alt" id="replay">↻ Повторить</button>
    <button class="btn alt" id="recmode">🎬 Для записи</button>
  </div>

  <div id="nftbox" style="display:none">
    <label>Ссылка на NFT-подарок (t.me/nft/Название-123)</label>
    <input id="link" placeholder="t.me/nft/LoveCandle-123" inputmode="url">
    <div class="row">
      <div><label>Модель</label><input id="model"></div>
      <div><label>Номер</label><input id="num" inputmode="numeric"></div>
    </div>
    <div class="row">
      <div><label>Фон</label><input id="backdrop"></div>
      <div><label>Узор</label><input id="symbol"></div>
    </div>
    <label>Цвет фона карточки</label>
    <input id="color" type="color" value="#c2593a" style="height:44px;padding:4px">
  </div>

  <div id="starsbox">
    <div class="row">
      <div><label>Звёзды</label><input id="stars" value="75" inputmode="numeric"></div>
      <div><label>TON</label><input id="ton" value="0,83"></div>
      <div><label>$</label><input id="usd" value="1,12"></div>
    </div>
  </div>

  <label>Имя отправителя</label>
  <input id="sender" placeholder="Неизвестный пользователь">
  <div class="sw"><input type="checkbox" id="unknown" checked><label style="margin:0;opacity:1">«Неизвестный пользователь»</label></div>
  <label>Текст плашки (пусто = по умолчанию)</label>
  <input id="banner">
  <div class="row">
    <div><label>Дата над плашкой (NFT)</label><input id="date" placeholder="3 июля"></div>
    <div><label>Текст кнопки</label><input id="button" value="Посмотреть"></div>
  </div>
  <div class="row">
    <div><label>Фон чата</label>
      <select id="bg"><option value="dark">Тёмный</option><option value="light">Светлый</option></select></div>
    <div class="sw" style="align-items:flex-end"><input type="checkbox" id="mock" checked><label style="margin:0;opacity:1">Метка МАКЕТ</label></div>
  </div>

  <button class="btn" id="send">Показать в чате</button>
  <div id="msg"></div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
let kind = 'stars', nft = null;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`}
function name(){return $('unknown').checked ? 'Неизвестный пользователь' : ($('sender').value||'Неизвестный пользователь')}

function starBoxSVG(){return `<svg class="gift-img" width="62%" viewBox="0 0 200 200"><polygon points="30,80 170,80 155,175 45,175" fill="#46a03c"/><polygon points="30,80 55,55 145,55 170,80" fill="#64be50"/><rect x="88" y="55" width="24" height="120" fill="#ffbe28"/><rect x="30" y="105" width="140" height="18" fill="#ffbe28"/><polygon points="100,2 113,32 146,34 120,54 129,86 100,68 71,86 80,54 54,34 87,32" fill="#ffcd28" stroke="#ffe678"/></svg>`}

function draw(){
  const c = $('center'); $('stage').className = 'stage' + ($('bg').value==='light'?' light':'');
  const mock = $('mock').checked ? '<div class="mock">МАКЕТ</div>' : '';
  const btn = esc($('button').value||'Посмотреть');
  if (kind==='stars'){
    const t = $('banner').value || `${name()} отправил(а) Вам подарок стоимостью ${$('ton').value} TON (~ ${$('usd').value} $)`;
    c.innerHTML = `<div class="pill">${esc(t)}</div>
      <div class="card stars">${starBoxSVG()}
        <div class="t1">${esc($('stars').value)} звёзд</div>
        <div class="desc">Используйте звёзды, чтобы открывать контент и получать услуги в Telegram.</div>
        <div class="vbtn">${btn}<i class="spark" style="left:8%;top:12%"></i><i class="spark" style="right:6%;bottom:14%;animation-delay:.5s"></i></div>
      </div>${mock}`;
  } else {
    const col = $('color').value;
    const t = $('banner').value || `${name()} передал(а) Вам подарок!`;
    const d = $('date').value ? `<div class="pill">${esc($('date').value)}</div>` : '';
    const title = nft ? nft.title : 'Название';
    const num = Number($('num').value||0).toLocaleString('en-US');
    const img = nft ? `<img class="gift-img" width="60%" src="${esc(nft.image)}" onerror="this.style.display='none'">` : '<div style="height:120px"></div>';
    c.innerHTML = `${d}<div class="pill">${esc(t)}</div>
      <div class="card nft" style="background:radial-gradient(circle at 50% 30%,${shade(col,1.25)},${col})">
        <div class="ribbon">подарок</div>
        <div style="padding-top:8%">${img}</div>
        <div class="t1">Подарок от ${esc(name())}</div>
        <div class="t2">${esc(title)} #${num}</div>
        <div class="fields"><span>Модель</span><b>${esc($('model').value||'—')}</b><span>Фон</span><b>${esc($('backdrop').value||'—')}</b><span>Узор</span><b>${esc($('symbol').value||'—')}</b></div>
        <div class="vbtn" style="background:${shade(col,.65)}">${btn}</div>
      </div>${mock}`;
  }
  confetti();
}

/* конфетти */
function confetti(){
  const cv=$('conf'), st=$('stage'); cv.width=st.clientWidth; cv.height=st.clientHeight;
  const x=cv.getContext('2d'), P=[], cols=['#ffd23f','#ee4266','#3bceac','#0ead69','#5aa9ff','#fff'];
  for(let i=0;i<170;i++){const a=Math.random()*Math.PI*2, s=4+Math.random()*9;
    P.push({x:cv.width/2,y:cv.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:1})}
  const t0=performance.now();
  (function f(t){const el=(t-t0)/3000; x.clearRect(0,0,cv.width,cv.height); if(el>=1)return;
    P.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=1-el;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    requestAnimationFrame(f)})(t0);
}

function setKind(k){kind=k;$('tab-stars').className=k==='stars'?'on':'';$('tab-nft').className=k==='nft'?'on':'';
  $('starsbox').style.display=k==='stars'?'':'none';$('nftbox').style.display=k==='nft'?'':'none';draw()}
$('tab-stars').onclick=()=>setKind('stars'); $('tab-nft').onclick=()=>setKind('nft');
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{
  if(e.id==='stars'){const s=+e.value||0;$('ton').value=(s*0.0111).toFixed(2).replace('.',',');$('usd').value=(s*0.015).toFixed(2).replace('.',',')}
  if(e.id!=='link')draw()}));
$('replay').onclick=draw;
$('recmode').onclick=()=>{document.body.classList.add('rec');draw();let last=0;
  document.body.onclick=()=>{const n=Date.now();if(n-last<350){document.body.classList.remove('rec');document.body.onclick=null}else draw();last=n}};

$('link').addEventListener('change',async()=>{
  $('msg').textContent='Ищу подарок…';
  try{const r=await fetch('/api/nft?link='+encodeURIComponent($('link').value));const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'Ошибка');
    nft=j;$('model').value=j.model;$('backdrop').value=j.backdrop;$('symbol').value=j.symbol;$('num').value=j.number;
    if(j.color)$('color').value=j.color;$('msg').textContent='Готово ✓';draw()}
  catch(e){$('msg').textContent=e.message}});

$('send').onclick=async()=>{
  $('msg').textContent='Отправляю…';
  const params={kind,sender:name(),stars:$('stars').value,ton:$('ton').value,usd:$('usd').value,
    banner:$('banner').value,date:$('date').value,button:$('button').value,bg:$('bg').value,mock:$('mock').checked,
    color:$('color').value,nft:nft?{...nft,number:+$('num').value||nft.number,model:$('model').value,backdrop:$('backdrop').value,symbol:$('symbol').value}:null};
  if(kind==='nft'&&!nft){$('msg').textContent='Сначала вставь ссылку на NFT-подарок';return}
  try{const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',params})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Ошибка');
    $('msg').textContent='Отправлено в чат с ботом ✓'}
  catch(e){$('msg').textContent=e.message}};

draw();
</script>
</body>
</html>
