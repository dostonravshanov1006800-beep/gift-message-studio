services:
  gms:
    build: .
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./cache:/app/cache
